// ─────────────────────────────────────────────────────────────
[
{s:"Cells & Genetics",q:"Which of the following BEST describes the role of the smooth endoplasmic reticulum (SER)?",o:["Synthesizing proteins","Synthesizing lipids and detoxifying drugs","Packaging proteins for export","Producing ATP"],a:1,e:"The smooth ER lacks ribosomes and is involved in lipid synthesis, steroid hormone production, detoxification of drugs and poisons, and calcium ion storage."},
{s:"Cells & Genetics",q:"A test cross is used to determine:",o:["The phenotype of an organism","Whether an organism showing a dominant phenotype is homozygous or heterozygous","The number of chromosomes in a cell","The rate of mutation in a population"],a:1,e:"A test cross involves crossing an organism with a dominant phenotype with a homozygous recessive organism. If any offspring show the recessive phenotype, the dominant parent is heterozygous."},
{s:"Cells & Genetics",q:"Which of the following BEST describes incomplete dominance?",o:["One allele completely masks the other","The heterozygous phenotype is intermediate between the two homozygous phenotypes","Both alleles are fully expressed simultaneously","The dominant allele is expressed only in males"],a:1,e:"Incomplete dominance produces a blended phenotype in heterozygotes. For example, crossing red (RR) and white (WW) snapdragons produces pink (RW) offspring."},
{s:"Cells & Genetics",q:"Which of the following BEST describes the role of restriction enzymes in genetic engineering?",o:["Joining DNA fragments together","Cutting DNA at specific nucleotide sequences","Replicating DNA","Transcribing DNA into RNA"],a:1,e:"Restriction enzymes (restriction endonucleases) cut DNA at specific recognition sequences, producing fragments that can be used in cloning, genetic engineering, and DNA fingerprinting."},
{s:"Cells & Genetics",q:"Which of the following BEST describes the process of polymerase chain reaction (PCR)?",o:["A technique to sequence DNA","A technique to amplify specific DNA sequences in vitro","A method to insert genes into bacteria","A process to separate DNA fragments by size"],a:1,e:"PCR (Polymerase Chain Reaction) amplifies specific DNA sequences exponentially using repeated cycles of denaturation, annealing (primers), and extension (DNA polymerase), producing millions of copies."},
{s:"Body Systems",q:"Which of the following BEST describes the role of the sinoatrial (SA) node?",o:["Filtering blood in the kidneys","Acting as the heart's natural pacemaker, initiating electrical impulses","Producing red blood cells","Regulating blood pressure in arteries"],a:1,e:"The SA node (sinoatrial node) in the right atrium is the heart's natural pacemaker. It generates electrical impulses that spread through the heart, causing coordinated contractions."},
{s:"Body Systems",q:"Which of the following BEST describes the difference between arteries and veins?",o:["Arteries carry deoxygenated blood; veins carry oxygenated blood","Arteries carry blood away from the heart; veins carry blood toward the heart","Arteries have valves; veins do not","Arteries are thinner than veins"],a:1,e:"Arteries carry blood away from the heart (usually oxygenated) and have thick, elastic walls. Veins carry blood toward the heart (usually deoxygenated) and have thinner walls with valves to prevent backflow."},
{s:"Body Systems",q:"Which of the following BEST describes the role of the villus in the small intestine?",o:["Producing digestive enzymes","Increasing surface area for nutrient absorption","Producing mucus to protect the intestinal lining","Contracting to move food through the intestine"],a:1,e:"Villi (and microvilli) are finger-like projections that dramatically increase the surface area of the small intestine, maximizing the absorption of nutrients into the bloodstream."},
{s:"Body Systems",q:"Which of the following BEST describes the function of B lymphocytes (B cells)?",o:["Directly killing infected cells","Producing antibodies that target specific antigens","Regulating body temperature","Producing red blood cells"],a:1,e:"B lymphocytes (B cells) are part of the adaptive immune system. When activated, they differentiate into plasma cells that produce antibodies specific to a particular antigen."},
{s:"Homeostasis",q:"Which of the following BEST describes the role of the renin-angiotensin-aldosterone system (RAAS)?",o:["Regulating blood glucose levels","Regulating blood pressure and fluid balance","Controlling body temperature","Regulating calcium levels"],a:1,e:"The RAAS is a hormonal system that regulates blood pressure and fluid balance. When blood pressure drops, the kidneys release renin, triggering a cascade that increases blood pressure and sodium/water retention."},
{s:"Homeostasis",q:"Which of the following BEST describes the concept of acclimatization?",o:["Genetic adaptation over many generations","Short-term physiological adjustments to environmental changes within an individual's lifetime","Behavioral changes in response to predators","The process of natural selection"],a:1,e:"Acclimatization is a reversible physiological adjustment an individual makes in response to environmental changes (e.g., increased red blood cell production at high altitude) within its lifetime, not involving genetic change."},
{s:"Homeostasis",q:"Which of the following BEST describes the role of the parathyroid glands?",o:["Regulating metabolic rate","Regulating blood calcium levels","Producing adrenaline","Regulating blood glucose"],a:1,e:"The parathyroid glands produce parathyroid hormone (PTH), which raises blood calcium levels by stimulating bone resorption, increasing calcium absorption in the intestine, and reducing calcium excretion by the kidneys."},
{s:"Evolution",q:"Which of the following BEST describes the founder effect?",o:["A large population colonizing a new area","A small group of individuals establishing a new population, with reduced genetic diversity","The extinction of a population due to disease","The gradual adaptation of a population to a new environment"],a:1,e:"The founder effect occurs when a small group of individuals establishes a new population. The new population has reduced genetic diversity and may have different allele frequencies than the original population."},
{s:"Evolution",q:"Which of the following BEST describes sympatric speciation?",o:["Speciation occurring due to geographic isolation","Speciation occurring within the same geographic area without physical barriers","Speciation caused by the bottleneck effect","Speciation occurring only in plants"],a:1,e:"Sympatric speciation occurs when new species evolve from a single ancestral species while inhabiting the same geographic region. It can occur through polyploidy (common in plants) or ecological specialization."},
{s:"Evolution",q:"Which of the following BEST describes the concept of punctuated equilibrium?",o:["Evolution occurs at a constant, slow rate","Long periods of stability are interrupted by rapid bursts of evolutionary change","Evolution only occurs during mass extinctions","All species evolve at the same rate"],a:1,e:"Punctuated equilibrium (proposed by Gould and Eldredge) suggests that species remain relatively stable for long periods (stasis) punctuated by rapid evolutionary changes, often associated with environmental disruptions."},
{s:"Evolution",q:"Which of the following BEST describes the role of mutations in evolution?",o:["Mutations are always harmful and reduce fitness","Mutations are the ultimate source of new genetic variation in populations","Mutations only occur in somatic cells","Mutations are directed by environmental needs"],a:1,e:"Mutations are random changes in DNA sequence that create new alleles, providing the raw material for evolution. Most mutations are neutral, some are harmful, and occasionally one is beneficial."},
{s:"Ecology",q:"Which of the following BEST describes the concept of an ecosystem service?",o:["Services provided by humans to maintain ecosystems","Benefits that humans receive from ecosystems, such as clean water, pollination, and climate regulation","The economic value of endangered species","Services provided by zoos and aquariums"],a:1,e:"Ecosystem services are the benefits humans receive from ecosystems, including provisioning services (food, water), regulating services (climate, flood control), cultural services (recreation), and supporting services (nutrient cycling)."},
{s:"Ecology",q:"Which of the following BEST describes the concept of r-selected vs. K-selected species?",o:["r-selected species have few offspring with high parental care; K-selected species have many offspring with little care","r-selected species have many offspring with little parental care; K-selected species have few offspring with high parental care","Both strategies produce the same number of offspring","r-selected species only live in aquatic environments"],a:1,e:"r-selected species (rabbits, insects) produce many offspring with little parental care, adapted for unstable environments. K-selected species (elephants, humans) produce few offspring with extensive parental care, adapted for stable environments near carrying capacity."},
{s:"Ecology",q:"Which of the following BEST describes the marine biome?",o:["Freshwater ecosystems with low salinity","The largest biome, covering about 71% of Earth's surface, with high salinity","Coastal wetlands with brackish water","Deep underground aquatic systems"],a:1,e:"The marine biome is the largest biome on Earth, covering about 71% of the surface. It includes oceans, coral reefs, and estuaries, characterized by high salinity and diverse ecosystems."},
{s:"Ecology",q:"Which of the following BEST describes the concept of competitive exclusion?",o:["Two species can coexist indefinitely in the same niche","Two species competing for identical resources cannot coexist; one will outcompete the other","Competition always leads to the extinction of both species","Species avoid competition by living in different biomes"],a:1,e:"The competitive exclusion principle (Gause's law) states that two species competing for exactly the same resources cannot coexist indefinitely; the superior competitor will eventually exclude the other."},
{s:"Ecology",q:"Which of the following BEST describes the role of mycorrhizal fungi in ecosystems?",o:["Decomposing dead organic matter only","Forming mutualistic associations with plant roots, enhancing nutrient and water uptake","Parasitizing plant roots and reducing plant growth","Producing toxins that kill competing plants"],a:1,e:"Mycorrhizal fungi form mutualistic symbioses with plant roots. The fungi extend the plant's root system, dramatically increasing water and nutrient (especially phosphorus) uptake, while receiving carbohydrates from the plant."},
{s:"Cells & Genetics",q:"Which of the following BEST describes the process of gel electrophoresis?",o:["Amplifying DNA sequences","Separating DNA fragments by size using an electric field","Inserting genes into host organisms","Sequencing the order of nucleotides in DNA"],a:1,e:"Gel electrophoresis separates DNA (or protein) fragments by size. An electric current moves negatively charged DNA through a gel matrix; smaller fragments move faster and farther than larger ones."},
{s:"Body Systems",q:"Which of the following BEST describes the role of the corpus callosum?",o:["Regulating breathing and heart rate","Connecting the two cerebral hemispheres and allowing communication between them","Controlling balance and coordination","Processing sensory information from the skin"],a:1,e:"The corpus callosum is a thick band of nerve fibers connecting the left and right cerebral hemispheres, allowing them to communicate and coordinate functions."},
{s:"Homeostasis",q:"Which of the following BEST describes the role of antidiuretic hormone (ADH)?",o:["Increasing urine production","Causing the kidneys to reabsorb more water, reducing urine output","Regulating blood glucose levels","Stimulating the immune system"],a:1,e:"ADH (vasopressin) is released by the posterior pituitary when blood osmolarity rises. It causes the kidneys to reabsorb more water, producing concentrated urine and maintaining blood water balance."},
{s:"Evolution",q:"Which of the following BEST describes the concept of gene flow?",o:["The movement of genes within a single organism","The transfer of alleles between populations through migration","Random changes in allele frequencies","The expression of genes in different tissues"],a:1,e:"Gene flow (migration) is the transfer of alleles from one population to another through the movement of individuals or gametes. It can introduce new alleles and reduce genetic differences between populations."},
{s:"Ecology",q:"Which of the following BEST describes the concept of an umbrella species?",o:["A species that provides shade for other organisms","A species whose conservation protects many other species sharing its habitat","A species at the top of the food chain","A species that is found in every ecosystem"],a:1,e:"An umbrella species is one whose conservation automatically protects many other species sharing its habitat. Protecting large-ranging species like grizzly bears or tigers preserves vast ecosystems."},
{s:"Cells & Genetics",q:"Which of the following BEST describes the role of telomeres?",o:["Initiating DNA replication","Protecting the ends of chromosomes from degradation and fusion","Coding for essential proteins","Regulating gene expression"],a:1,e:"Telomeres are repetitive DNA sequences at the ends of chromosomes that protect them from degradation, fusion with other chromosomes, and loss of genetic information during replication."},
{s:"Body Systems",q:"Which of the following BEST describes the role of the gallbladder?",o:["Producing bile","Storing and concentrating bile produced by the liver","Producing digestive enzymes","Absorbing fats from the small intestine"],a:1,e:"The gallbladder stores and concentrates bile produced by the liver. When fatty food enters the small intestine, the gallbladder releases bile to emulsify fats, aiding digestion."},
{s:"Ecology",q:"Which of the following BEST describes the concept of island biogeography?",o:["The study of species found only on islands","The theory that species richness on islands is determined by immigration and extinction rates, influenced by island size and distance from mainland","The study of how islands form","The distribution of marine species around islands"],a:1,e:"Island biogeography theory (MacArthur & Wilson) predicts that species richness on islands is determined by the balance between immigration (higher for larger, closer islands) and extinction (lower for larger islands)."},
{s:"Cells & Genetics",q:"Which of the following BEST describes the concept of codominance?",o:["One allele partially masks the other","Both alleles are fully and simultaneously expressed in the heterozygote","The heterozygote shows an intermediate phenotype","Only one allele is expressed at a time"],a:1,e:"Codominance occurs when both alleles are fully expressed simultaneously in the heterozygote. AB blood type is an example: both A and B antigens are expressed on red blood cells."},
{s:"Body Systems",q:"Which of the following BEST describes the role of the thymus gland?",o:["Producing thyroid hormones","Maturing T lymphocytes (T cells) for immune function","Producing red blood cells","Regulating blood calcium levels"],a:1,e:"The thymus is a lymphoid organ where T lymphocytes mature and become immunocompetent. It is most active during childhood and gradually shrinks with age."},
{s:"Homeostasis",q:"Which of the following BEST describes the concept of allostasis?",o:["Maintaining a fixed set point for all physiological variables","Achieving stability through change, adjusting set points based on anticipated demands","A type of negative feedback loop","The process of acclimatization to cold temperatures"],a:1,e:"Allostasis refers to achieving stability through change. Unlike homeostasis (fixed set points), allostasis involves adjusting physiological parameters in anticipation of demands (e.g., increased heart rate before exercise)."},
{s:"Evolution",q:"Which of the following BEST describes the concept of kin selection?",o:["Selecting mates based on genetic similarity","Altruistic behavior that benefits relatives, increasing inclusive fitness","Competition between siblings for resources","The selection of traits that benefit the entire species"],a:1,e:"Kin selection is an evolutionary strategy where organisms favor the reproductive success of their relatives, even at a cost to themselves. Hamilton's rule: altruism evolves when rB > C (r=relatedness, B=benefit, C=cost)."},
{s:"Ecology",q:"Which of the following BEST describes the concept of ecological stoichiometry?",o:["The study of chemical reactions in ecosystems","The study of the balance of chemical elements in ecological interactions","The measurement of ecosystem productivity","The study of nutrient cycling in aquatic systems"],a:1,e:"Ecological stoichiometry examines how the balance of chemical elements (C, N, P) affects ecological interactions, from individual organisms to ecosystems, influencing growth, reproduction, and food web dynamics."},
{s:"Cells & Genetics",q:"Which of the following BEST describes the role of the nucleolus?",o:["Storing genetic information","Producing ribosomal RNA (rRNA) and assembling ribosome subunits","Regulating cell division","Synthesizing proteins"],a:1,e:"The nucleolus is a dense region within the nucleus where ribosomal RNA (rRNA) is transcribed and ribosome subunits are assembled before being exported to the cytoplasm."},
{s:"Body Systems",q:"Which of the following BEST describes the role of the autonomic nervous system?",o:["Controlling voluntary muscle movements","Regulating involuntary functions like heart rate, digestion, and breathing","Processing sensory information from the environment","Coordinating balance and fine motor control"],a:1,e:"The autonomic nervous system (ANS) regulates involuntary body functions. The sympathetic division activates the 'fight-or-flight' response; the parasympathetic division promotes 'rest-and-digest' functions."},
{s:"Ecology",q:"Which of the following BEST describes the concept of the intermediate disturbance hypothesis?",o:["Ecosystems with no disturbance have the highest biodiversity","Ecosystems with intermediate levels of disturbance have the highest biodiversity","High levels of disturbance always increase biodiversity","Disturbance always decreases biodiversity"],a:1,e:"The intermediate disturbance hypothesis proposes that biodiversity is highest at intermediate levels of disturbance. Too little disturbance allows competitive exclusion; too much disturbance prevents species establishment."},
{s:"Cells & Genetics",q:"Which of the following BEST describes the process of RNA interference (RNAi)?",o:["The process of transcribing DNA into RNA","A mechanism where small RNA molecules silence gene expression by degrading mRNA","The process of translating mRNA into protein","A method of DNA repair"],a:1,e:"RNA interference (RNAi) is a gene silencing mechanism where small RNA molecules (siRNA, miRNA) bind to complementary mRNA sequences, targeting them for degradation or blocking translation."}
],

[
{s:"Cells & Genetics",q:"Which of the following BEST describes the role of the vacuole in plant cells?",o:["Producing energy through photosynthesis","Storing water, nutrients, and waste products, and maintaining turgor pressure","Synthesizing proteins","Packaging and shipping proteins"],a:1,e:"The large central vacuole in plant cells stores water (maintaining turgor pressure for structural support), nutrients, pigments, and waste products. It can occupy up to 90% of the cell's volume."},
{s:"Cells & Genetics",q:"Which of the following BEST describes the concept of pleiotropy?",o:["One gene controlling one trait","One gene affecting multiple phenotypic traits","Multiple genes controlling one trait","The interaction between two alleles of the same gene"],a:1,e:"Pleiotropy occurs when a single gene influences multiple phenotypic traits. Sickle cell disease is an example: the single mutation affects red blood cell shape, oxygen transport, and causes multiple organ complications."},
{s:"Cells & Genetics",q:"Which of the following BEST describes the process of DNA repair?",o:["The process of DNA replication","Cellular mechanisms that detect and correct errors in DNA sequence","The process of gene expression","The degradation of damaged DNA"],a:1,e:"DNA repair mechanisms (base excision repair, nucleotide excision repair, mismatch repair) detect and correct errors in DNA sequence, preventing mutations from being passed to daughter cells."},
{s:"Cells & Genetics",q:"Which of the following BEST describes the role of proto-oncogenes?",o:["Genes that suppress tumor formation","Normal genes that regulate cell growth and division, which can become oncogenes when mutated","Genes that cause apoptosis","Genes that repair DNA damage"],a:1,e:"Proto-oncogenes are normal genes that regulate cell growth and division. When mutated or overexpressed, they become oncogenes that drive uncontrolled cell proliferation, potentially leading to cancer."},
{s:"Cells & Genetics",q:"Which of the following BEST describes the concept of polygenic inheritance?",o:["One gene controlling multiple traits","Multiple genes each contributing to a single trait, producing a continuous range of phenotypes","The inheritance of traits on sex chromosomes","The inheritance of traits through mitochondrial DNA"],a:1,e:"Polygenic inheritance involves multiple genes (each with multiple alleles) contributing to a single trait, producing a continuous range of phenotypes. Height, skin color, and intelligence are polygenic traits."},
{s:"Body Systems",q:"Which of the following BEST describes the role of the hypothalamic-pituitary axis?",o:["Regulating digestion and nutrient absorption","The master regulatory system controlling many endocrine glands through releasing and inhibiting hormones","Regulating blood pressure through the kidneys","Controlling voluntary muscle movements"],a:1,e:"The hypothalamic-pituitary axis is the master regulatory system of the endocrine system. The hypothalamus releases hormones that stimulate or inhibit the pituitary gland, which in turn regulates other endocrine glands."},
{s:"Body Systems",q:"Which of the following BEST describes the process of synaptic transmission?",o:["The movement of ions through gap junctions","The release of neurotransmitters from the presynaptic neuron, diffusion across the synapse, and binding to receptors on the postsynaptic neuron","The direct electrical connection between neurons","The reuptake of neurotransmitters by the postsynaptic neuron"],a:1,e:"Synaptic transmission: an action potential reaches the axon terminal → neurotransmitters are released into the synaptic cleft → they diffuse across and bind to receptors on the postsynaptic membrane → the signal is transmitted."},
{s:"Body Systems",q:"Which of the following BEST describes the role of the complement system in immunity?",o:["Producing antibodies against specific antigens","A group of proteins that enhance the ability of antibodies and phagocytes to clear pathogens","Regulating the inflammatory response only","Producing T cells in the thymus"],a:1,e:"The complement system is a group of proteins that enhance (complement) the immune response by marking pathogens for destruction (opsonization), directly lysing pathogens, and promoting inflammation."},
{s:"Body Systems",q:"Which of the following BEST describes the role of the glomerulus in the kidney?",o:["Reabsorbing glucose and amino acids","Filtering blood under pressure to produce filtrate","Concentrating urine by removing water","Secreting waste products into the tubule"],a:1,e:"The glomerulus is a capillary network in the nephron where blood is filtered under high pressure. Small molecules (water, glucose, ions, urea) pass into the Bowman's capsule as filtrate; large proteins and cells remain in the blood."},
{s:"Homeostasis",q:"Which of the following BEST describes the role of the baroreceptors in blood pressure regulation?",o:["Detecting changes in blood glucose levels","Detecting changes in blood pressure and triggering responses to maintain normal pressure","Regulating body temperature","Detecting changes in blood oxygen levels"],a:1,e:"Baroreceptors are stretch receptors in the walls of major blood vessels (aorta, carotid arteries) that detect changes in blood pressure and send signals to the brain to adjust heart rate and vessel diameter."},
{s:"Homeostasis",q:"Which of the following BEST describes the concept of countercurrent exchange in the kidney?",o:["The exchange of gases in the lungs","A mechanism in the loop of Henle that creates an osmotic gradient to concentrate urine","The exchange of nutrients between blood and tissues","The regulation of blood pH by the lungs and kidneys"],a:1,e:"Countercurrent exchange in the loop of Henle creates an osmotic gradient in the kidney medulla. The descending limb loses water; the ascending limb pumps out ions, creating a gradient that allows the collecting duct to concentrate urine."},
{s:"Homeostasis",q:"Which of the following BEST describes the role of the blood-brain barrier?",o:["Filtering blood in the brain","A selective barrier formed by tight junctions in brain capillaries that protects the brain from harmful substances","Regulating blood flow to the brain","Producing cerebrospinal fluid"],a:1,e:"The blood-brain barrier (BBB) is formed by tight junctions between endothelial cells of brain capillaries. It selectively allows essential nutrients to pass while blocking most pathogens, toxins, and many drugs."},
{s:"Evolution",q:"Which of the following BEST describes the concept of sexual dimorphism?",o:["The existence of two sexes in a species","Differences in morphology between males and females of the same species, often driven by sexual selection","The ability of some organisms to change sex","The genetic differences between males and females"],a:1,e:"Sexual dimorphism refers to differences in size, color, or morphology between males and females of the same species. It is often driven by sexual selection (e.g., peacock feathers, lion manes, deer antlers)."},
{s:"Evolution",q:"Which of the following BEST describes the concept of neutral evolution?",o:["Evolution driven by natural selection","Changes in allele frequencies due to random genetic drift, not natural selection","Evolution that has no effect on the organism","The evolution of traits that are neither beneficial nor harmful"],a:1,e:"Neutral evolution (neutral theory, proposed by Kimura) suggests that most genetic variation at the molecular level is selectively neutral and changes in allele frequencies are due to genetic drift rather than natural selection."},
{s:"Evolution",q:"Which of the following BEST describes the concept of exaptation?",o:["The evolution of a new trait from scratch","A trait that evolved for one function being co-opted for a different function","The loss of a trait over evolutionary time","The parallel evolution of similar traits in different lineages"],a:1,e:"Exaptation (pre-adaptation) occurs when a trait that evolved for one function is co-opted for a different function. Bird feathers may have evolved for thermoregulation before being co-opted for flight."},
{s:"Evolution",q:"Which of the following BEST describes the concept of macroevolution?",o:["Small-scale changes within a population over a few generations","Large-scale evolutionary changes above the species level, including speciation and extinction","The evolution of antibiotic resistance in bacteria","Changes in allele frequencies within a population"],a:1,e:"Macroevolution refers to large-scale evolutionary changes above the species level, including the origin of new species (speciation), extinction, and the evolution of major new body plans over geological time."},
{s:"Ecology",q:"Which of the following BEST describes the concept of the ecological footprint?",o:["The physical area occupied by an organism","A measure of human demand on Earth's ecosystems, expressed as the area of land and water needed to sustain a population","The impact of invasive species on native ecosystems","The carbon emissions of a single individual"],a:1,e:"The ecological footprint measures the amount of biologically productive land and water area required to produce the resources consumed and absorb the waste generated by a population or individual."},
{s:"Ecology",q:"Which of the following BEST describes the concept of the phosphorus cycle?",o:["The cycling of phosphorus through the atmosphere, soil, water, and living organisms","The cycling of phosphorus only through aquatic ecosystems","The conversion of phosphorus gas to usable forms by bacteria","The movement of phosphorus through the food web only"],a:0,e:"The phosphorus cycle moves phosphorus through rocks (weathering), soil, water, and living organisms. Unlike carbon and nitrogen, phosphorus has no significant atmospheric component; it cycles primarily through soil and water."},
{s:"Ecology",q:"Which of the following BEST describes the concept of the edge effect in ecology?",o:["The decline of species at the edges of their geographic range","The increased biodiversity and unique species assemblages found at the boundaries between two different ecosystems","The negative effects of habitat fragmentation on interior species","The effect of ocean currents on coastal ecosystems"],a:1,e:"The edge effect refers to the increased biodiversity and unique ecological conditions found at the ecotone (boundary) between two different ecosystems. Edge habitats support species from both adjacent ecosystems plus edge specialists."},
{s:"Ecology",q:"Which of the following BEST describes the concept of biological control?",o:["Using chemicals to control pest populations","Using natural predators, parasites, or pathogens to control pest populations","Genetically modifying crops to resist pests","Physically removing pests from an ecosystem"],a:1,e:"Biological control uses natural enemies (predators, parasites, pathogens) to control pest populations. It is an environmentally friendly alternative to chemical pesticides, though it requires careful management to avoid unintended consequences."},
{s:"Ecology",q:"Which of the following BEST describes the concept of the Gaia hypothesis?",o:["The idea that Earth was created by a single event","The hypothesis that Earth's biosphere, atmosphere, and geosphere interact as a self-regulating system","The theory that life originated from space","The concept that all ecosystems are interconnected through food webs"],a:1,e:"The Gaia hypothesis (James Lovelock) proposes that Earth's biosphere, atmosphere, hydrosphere, and geosphere interact as a complex, self-regulating system that maintains conditions suitable for life."},
{s:"Cells & Genetics",q:"Which of the following BEST describes the role of tumor suppressor genes?",o:["Promoting cell division and growth","Inhibiting cell division and preventing tumor formation; mutations can lead to cancer","Repairing DNA damage only","Producing growth factors"],a:1,e:"Tumor suppressor genes (e.g., p53, BRCA1) normally inhibit cell division and promote apoptosis. When both copies are mutated (loss of function), cells can divide uncontrollably, leading to cancer."},
{s:"Body Systems",q:"Which of the following BEST describes the role of the renin enzyme in blood pressure regulation?",o:["Directly constricting blood vessels","Initiating the RAAS cascade by converting angiotensinogen to angiotensin I","Directly increasing heart rate","Stimulating aldosterone production directly"],a:1,e:"Renin is released by the kidneys when blood pressure drops. It converts angiotensinogen (from the liver) to angiotensin I, which is then converted to angiotensin II, causing vasoconstriction and aldosterone release."},
{s:"Homeostasis",q:"Which of the following BEST describes the concept of pH homeostasis in the blood?",o:["Blood pH is not regulated and varies widely","Blood pH is maintained between 7.35-7.45 by buffer systems, the lungs, and kidneys","Blood pH is regulated only by the kidneys","Blood pH is maintained at exactly 7.0"],a:1,e:"Blood pH is tightly regulated between 7.35-7.45 by three systems: chemical buffers (bicarbonate, phosphate, proteins), the respiratory system (CO₂ elimination), and the kidneys (H⁺ and HCO₃⁻ regulation)."},
{s:"Evolution",q:"Which of the following BEST describes the concept of inclusive fitness?",o:["The total number of offspring an individual produces","An individual's direct reproductive success plus the indirect reproductive success gained through helping relatives","The fitness of an entire population","The fitness advantage gained through cooperation with non-relatives"],a:1,e:"Inclusive fitness (Hamilton) is the total effect an individual has on propagating its genes, including its own reproduction (direct fitness) plus the reproduction of relatives (indirect fitness), weighted by the degree of relatedness."},
{s:"Ecology",q:"Which of the following BEST describes the concept of the trophic efficiency?",o:["The efficiency of photosynthesis in converting sunlight to chemical energy","The percentage of energy transferred from one trophic level to the next (typically ~10%)","The efficiency of decomposers in breaking down organic matter","The ratio of producers to consumers in an ecosystem"],a:1,e:"Trophic efficiency is the percentage of energy transferred from one trophic level to the next. Typically about 10% of energy is transferred; the rest is lost as heat through metabolic processes (respiration, movement)."},
{s:"Cells & Genetics",q:"Which of the following BEST describes the concept of genomic imprinting?",o:["The process of DNA replication","A form of epigenetic regulation where gene expression depends on which parent the allele was inherited from","The process of gene mutation","The regulation of gene expression by transcription factors"],a:1,e:"Genomic imprinting is an epigenetic phenomenon where the expression of a gene depends on whether it was inherited from the mother or father. The imprinted allele is silenced through methylation."},
{s:"Body Systems",q:"Which of the following BEST describes the role of the myelin sheath in nerve conduction?",o:["Producing neurotransmitters","Insulating the axon and increasing the speed of nerve impulse conduction","Connecting neurons at synapses","Producing the action potential"],a:1,e:"The myelin sheath is a fatty insulating layer around axons produced by Schwann cells (PNS) or oligodendrocytes (CNS). It enables saltatory conduction (jumping between nodes of Ranvier), dramatically increasing signal speed."},
{s:"Ecology",q:"Which of the following BEST describes the concept of the paradox of the plankton?",o:["The observation that plankton are found in all oceans","The observation that many phytoplankton species coexist in the same water column despite competing for the same limited resources","The paradox that plankton are both producers and consumers","The observation that plankton populations fluctuate seasonally"],a:1,e:"The paradox of the plankton (Hutchinson) notes that many phytoplankton species coexist in the same water column competing for the same resources (light, nutrients), seemingly violating the competitive exclusion principle. Explanations include environmental fluctuations and predation."},
{s:"Cells & Genetics",q:"Which of the following BEST describes the role of CRISPR-Cas9 in genetic engineering?",o:["A method to sequence entire genomes","A precise gene-editing tool that uses guide RNA to direct the Cas9 enzyme to cut specific DNA sequences","A technique to amplify DNA sequences","A method to insert genes into bacteria using plasmids"],a:1,e:"CRISPR-Cas9 is a revolutionary gene-editing technology. Guide RNA directs the Cas9 endonuclease to a specific DNA sequence, where it makes a precise cut. The cell's repair mechanisms can then be used to disable or modify the gene."},
{s:"Body Systems",q:"Which of the following BEST describes the concept of immunological memory?",o:["The brain's ability to remember past infections","The ability of the immune system to respond more rapidly and strongly to a pathogen it has encountered before","The storage of antibodies in lymph nodes","The ability of T cells to recognize self from non-self"],a:1,e:"Immunological memory is the ability of the adaptive immune system to mount a faster, stronger response upon re-exposure to a previously encountered antigen. Memory B and T cells persist long-term after the initial infection or vaccination."},
{s:"Ecology",q:"Which of the following BEST describes the concept of the metabolic theory of ecology?",o:["The study of energy metabolism in individual organisms","A theory linking metabolic rate to body size and temperature, predicting ecological patterns from individual to ecosystem levels","The study of how ecosystems process energy","The theory that all ecosystems have the same metabolic rate"],a:1,e:"The metabolic theory of ecology (Brown et al.) proposes that metabolic rate (scaling with body size and temperature) is the fundamental biological rate that governs ecological processes from individual organisms to entire ecosystems."},
{s:"Cells & Genetics",q:"Which of the following BEST describes the concept of horizontal gene transfer?",o:["The transfer of genes from parent to offspring","The transfer of genetic material between organisms of the same or different species without reproduction","The movement of genes between chromosomes during meiosis","The transfer of genes between organelles within a cell"],a:1,e:"Horizontal gene transfer (HGT) is the transfer of genetic material between organisms outside of parent-to-offspring inheritance. It is common in bacteria (via conjugation, transformation, transduction) and has played a major role in prokaryotic evolution."},
{s:"Ecology",q:"Which of the following BEST describes the concept of the Allee effect?",o:["The increase in population growth rate as population size increases","A decrease in individual fitness at low population densities, potentially leading to extinction","The effect of predators on prey population dynamics","The increase in competition as population density increases"],a:1,e:"The Allee effect describes a positive correlation between population size/density and individual fitness at low population sizes. Below a critical threshold, populations may decline to extinction due to difficulty finding mates, reduced cooperative defense, or inbreeding."}
]

]; // end EXAMS

// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════
let currentExam = null;
let currentQ = 0;
let answers = [];
let timerInterval = null;
let secondsLeft = 3600;
let submitted = false;

// ═══════════════════════════════════════════════════════════════
//  TIMER
// ═══════════════════════════════════════════════════════════════
function startTimer() {
  clearInterval(timerInterval);
  secondsLeft = 3600;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    secondsLeft--;
    updateTimerDisplay();
    if (secondsLeft <= 0) { clearInterval(timerInterval); submitExam(); }
  }, 1000);
}

function updateTimerDisplay() {
  const el = document.getElementById('timer');
  const m = Math.floor(secondsLeft / 60);
  const s = secondsLeft % 60;
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el.className = 'timer';
  if (secondsLeft <= 300) el.classList.add('danger');
  else if (secondsLeft <= 600) el.classList.add('warn');
}

// ═══════════════════════════════════════════════════════════════
//  START EXAM
// ═══════════════════════════════════════════════════════════════
function startExam(idx) {
  currentExam = idx;
  currentQ = 0;
  answers = new Array(40).fill(null);
  submitted = false;
  document.getElementById('selector').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  document.getElementById('exam-area').style.display = 'block';
  document.getElementById('exam-title').textContent = `Practice Exam ${idx + 1}`;
  startTimer();
  renderQuestion();
}

// ═══════════════════════════════════════════════════════════════
//  RENDER QUESTION
// ═══════════════════════════════════════════════════════════════
function renderQuestion() {
  const q = EXAMS[currentExam][currentQ];
  const total = EXAMS[currentExam].length;
  const answered = answers.filter(a => a !== null).length;

  // progress
  document.getElementById('prog-bar').style.width = `${((currentQ + 1) / total) * 100}%`;
  document.getElementById('prog-text').textContent = `Question ${currentQ + 1} of ${total}`;
  document.getElementById('answered-count').textContent = `${answered} answered`;

  // nav buttons
  document.getElementById('prev-btn').disabled = currentQ === 0;
  document.getElementById('next-btn').style.display = currentQ < total - 1 ? 'inline-block' : 'none';
  document.getElementById('submit-btn').style.display = currentQ === total - 1 ? 'inline-block' : 'none';

  const letters = ['A','B','C','D'];
  const sel = answers[currentQ];

  let optsHTML = q.o.map((opt, i) => {
    let cls = 'opt';
    if (submitted) {
      if (i === q.a) cls += ' correct';
      else if (i === sel && i !== q.a) cls += ' incorrect';
    } else {
      if (i === sel) cls += ' selected';
    }
    return `<div class="${cls}" onclick="${submitted ? '' : `selectAnswer(${i})`}">
      <span class="opt-letter">${letters[i]}</span>
      <span>${opt}</span>
    </div>`;
  }).join('');

  const expHTML = submitted
    ? `<div class="explanation show">💡 <strong>Explanation:</strong> ${q.e}</div>`
    : '';

  document.getElementById('q-container').innerHTML = `
    <div class="q-card">
      <div class="section-tag">${q.s}</div>
      <div class="q-num">Question ${currentQ + 1} of ${total}</div>
      <div class="q-text">${q.q}</div>
      <div class="options">${optsHTML}</div>
      ${expHTML}
    </div>`;
}

// ═══════════════════════════════════════════════════════════════
//  SELECT ANSWER
// ═══════════════════════════════════════════════════════════════
function selectAnswer(idx) {
  if (submitted) return;
  answers[currentQ] = idx;
  renderQuestion();
}

// ═══════════════════════════════════════════════════════════════
//  NAVIGATE
// ═══════════════════════════════════════════════════════════════
function navigate(dir) {
  currentQ = Math.max(0, Math.min(EXAMS[currentExam].length - 1, currentQ + dir));
  renderQuestion();
}

// ═══════════════════════════════════════════════════════════════
//  SUBMIT
// ═══════════════════════════════════════════════════════════════
function submitExam() {
  const unanswered = answers.filter(a => a === null).length;
  if (unanswered > 0 && !submitted) {
    if (!confirm(`You have ${unanswered} unanswered question(s). Submit anyway?`)) return;
  }
  clearInterval(timerInterval);
  submitted = true;
  showResults();
}

// ═══════════════════════════════════════════════════════════════
//  RESULTS
// ═══════════════════════════════════════════════════════════════
function showResults() {
  const qs = EXAMS[currentExam];
  let correct = 0;
  const sectionMap = {};

  qs.forEach((q, i) => {
    const isCorrect = answers[i] === q.a;
    if (isCorrect) correct++;
    if (!sectionMap[q.s]) sectionMap[q.s] = { correct: 0, total: 0 };
    sectionMap[q.s].total++;
    if (isCorrect) sectionMap[q.s].correct++;
  });

  const pct = Math.round((correct / qs.length) * 100);
  const pass = pct >= 70;

  document.getElementById('exam-area').style.display = 'none';
  document.getElementById('results').style.display = 'block';

  document.getElementById('res-score').textContent = `${correct} / ${qs.length}`;
  document.getElementById('res-pct').textContent = `${pct}%`;
  document.getElementById('res-pct').className = `score-pct ${pass ? 'pass' : 'fail'}`;
  document.getElementById('res-pass').textContent = pass
    ? '✅ Great work! You are on track to pass the GACE Life Science Testlet.'
    : '📚 Keep studying! Aim for 70%+ before your exam.';

  // breakdown by section
  let bdHTML = '';
  for (const [sec, data] of Object.entries(sectionMap)) {
    const sp = Math.round((data.correct / data.total) * 100);
    bdHTML += `<div class="breakdown-card">
      <div class="val">${data.correct}/${data.total}</div>
      <div class="lbl">${sec}</div>
      <div style="font-size:.8rem;color:${sp>=70?'var(--accent)':'var(--danger)'};margin-top:4px">${sp}%</div>
    </div>`;
  }
  document.getElementById('breakdown').innerHTML = bdHTML;

  // review
  const letters = ['A','B','C','D'];
  let revHTML = '';
  qs.forEach((q, i) => {
    const isCorrect = answers[i] === q.a;
    const userAns = answers[i] !== null ? letters[answers[i]] : 'No answer';
    revHTML += `<div class="review-item ${isCorrect ? 'right' : 'wrong'}">
      <div class="review-q"><strong>Q${i+1}.</strong> ${q.q}</div>
      <div class="review-ans">
        Your answer: <span class="${isCorrect ? 'c' : 'w'}">${userAns}${answers[i] !== null ? '. ' + q.o[answers[i]] : ''}</span>
        ${!isCorrect ? `<br>Correct answer: <span class="c">${letters[q.a]}. ${q.o[q.a]}</span>` : ''}
        <br><em style="color:var(--muted);font-size:.85rem">${q.e}</em>
      </div>
    </div>`;
  });
  document.getElementById('review-list').innerHTML = revHTML;
  window.scrollTo(0, 0);
}

// ═══════════════════════════════════════════════════════════════
//  GO HOME
// ═══════════════════════════════════════════════════════════════
function goHome() {
  clearInterval(timerInterval);
  submitted = false;
  document.getElementById('exam-area').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  document.getElementById('selector').style.display = 'block';
  window.scrollTo(0, 0);
}
</script>
</body>
</html>
